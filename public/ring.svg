<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring {
      fill: none;
      stroke: #e2470f;
      stroke-width: 12;
      stroke-dasharray: 502;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 100px 100px;
      animation: draw 1s ease-in-out backwards;
    }
    .label {
      font: 700 40px sans-serif;
      fill: #e2470f;
      animation: fade 1s ease-in-out 0.5s backwards;
    }
    @keyframes draw {
      from { stroke-dashoffset: 502; }
    }
    @keyframes fade {
      from { opacity: 0; }
    }
  </style>
  <circle class="ring" cx="100" cy="100" r="80" />
  <text class="label" x="100" y="114" text-anchor="middle">OK</text>
</svg>
